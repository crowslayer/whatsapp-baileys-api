name: Release Automática

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Crear Versión y Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Esencial para que lea todo el historial de commits

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Versión recomendada en tus prerrequisitos

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
