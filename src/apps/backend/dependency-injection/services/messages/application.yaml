services:
  # =============================================
  # UsesCase
  # =============================================
  application.messages.audio.audio_sender:
    class: 'context/modules/messages/application/audio/AudioSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.conctact.contact_sender:
    class: 'context/modules/messages/application/contact/ContactSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.document.document_sender:
    class: 'context/modules/messages/application/document/DocumentSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.image.image_sender:
    class: 'context/modules/messages/application/image/ImageSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.location.location_sender:
    class: 'context/modules/messages/application/location/LocationSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.reaction.reaction_sender:
    class: 'context/modules/messages/application/reaction/ReactionSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.sticker.sticker_sender:
    class: 'context/modules/messages/application/sticker/StickerSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  application.messages.text.text_sender:
    class: 'context/modules/messages/application/text/TextMessageSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.service.message_orchestrator'
    public: true

  application.messages.video.video_sender:
    class: 'context/modules/messages/application/video/VideoSender'
    arguments:
      - '@infrastructure.repository.whatsapp_instance'
      - '@application.runtime.runtime_manager'
    public: true

  # =============================================
  # CommandHandlers
  # =============================================
  application.messages.audio.send_audio_command_handler:
    class: 'context/modules/messages/application/audio/SendAudioCommandHandler'
    arguments:
      - '@application.messages.audio.audio_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.contact.send_contact_command_handler:
    class: 'context/modules/messages/application/contact/SendContactCommandHandler'
    arguments:
      - '@application.messages.conctact.contact_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.document.send_document_command_handler:
    class: 'context/modules/messages/application/document/SendDocumentCommandHandler'
    arguments:
      - '@application.messages.document.document_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.image.send_image_command_handler:
    class: 'context/modules/messages/application/image/SendImageCommandHandler'
    arguments:
      - '@application.messages.image.image_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.location.send_location_command_handler:
    class: 'context/modules/messages/application/location/SendLocationCommandHandler'
    arguments:
      - '@application.messages.location.location_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.reaction.send_reaction_command_handler:
    class: 'context/modules/messages/application/reaction/SendReactionCommandHandler'
    arguments:
      - '@application.messages.reaction.reaction_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.sticker.send_sticker_command_handler:
    class: 'context/modules/messages/application/sticker/SendStickerCommandHandler'
    arguments:
      - '@application.messages.sticker.sticker_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.text.send_text_command_handler:
    class: 'context/modules/messages/application/text/SendMessageCommandHandler'
    arguments:
      - '@application.messages.text.text_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  application.messages.video.send_video_command_handler:
    class: 'context/modules/messages/application/video/SendVideoCommandHandler'
    arguments:
      - '@application.messages.video.video_sender'
    tags:
      - { name: 'commandHandler' }
    public: true

  # =============================================
  # Orchestrator
  # =============================================
  application.service.human_behavior:
    class: 'context/shared/application/simulation/HumanBehaviorService'
    arguments:
      - '@shared.logger'
    public: true

  application.service.message_orchestrator:
    class: 'context/shared/application/services/MessageOrchestrator'
    arguments:
      - '@application.runtime.runtime_manager'
      - '@application.service.limiter_factory'
      - '@application.service.human_behavior'
      - '@shared.event_bus'
    public: true
  # =============================================
  # EventSubscribers
  # =============================================
  application.subscriber.store_message_received:
    class: 'context/modules/messages/application/events/subscribers/StoreIncomingMessageSubscriber'
    arguments:
      - '@infrastructure.repository.mongo.message_repository'
    tags:
      - { name: 'subscriber' }
    public: true

  application.subscriber.store_message_outgoing:
    class: 'context/modules/messages/application/events/subscribers/StoreOutgoingMessageSubscriber'
    arguments:
      - '@infrastructure.repository.mongo.message_repository'
    tags:
      - { name: 'subscriber' }
    public: true
